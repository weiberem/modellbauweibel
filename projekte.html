<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projekte – Modellbau Weibel</title>
  <meta name="description" content="Alle Modellflugzeug-Projekte von Martin Weibel – F-20 Tigershark, Swift S1, Pilatus PC-9 und mehr.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header" id="site-header"></header>

  <!-- Page Header -->
  <div class="page-header">
    <div class="container">
      <span class="section-label" style="color:var(--accent);">Portfolio</span>
      <h1>Meine Projekte</h1>
      <p>Eigenkonstruktionen und Modelle – vom ersten Entwurf bis zum Erstflug. Die meisten Flugzeuge sind vollständig selbst konstruiert und gebaut.</p>
    </div>
  </div>

  <!-- Projects Grid -->
  <section class="section">
    <div class="container">
      <div class="projects-grid" id="projects-grid">
        <!-- Filled by JS -->
      </div>
    </div>
  </section>

  <!-- Project Modal -->
  <div class="modal-overlay" id="project-modal" onclick="closeProjectModal()"></div>

  <!-- Footer -->
  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const projects = await loadProjectsData();
      const grid = document.getElementById('projects-grid');
      if (grid && projects.length) {
        grid.innerHTML = projects.map(renderProjectCard).join('');
        setTimeout(initScrollAnimations, 50);
      }
    });
  </script>
</body>
</html>
