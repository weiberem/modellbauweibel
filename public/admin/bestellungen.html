<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bestellungen – Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <a href="/admin/" class="sidebar-logo">
        <svg viewBox="0 0 36 36" width="28" height="28"><path d="M33 16l-15-14-3 3 4 5-12 4-5-3-2 2 6 6-3 3c-1 1-1.5 3-.5 4s3 .5 4-.5l3-3 6 6 2-2-3-5 4-12 5 4z" fill="#c8872b"/></svg>
        Modellbau <span>Weibel</span>
      </a>
      <ul class="sidebar-nav">
        <li><a href="/admin/"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a></li>
        <li><a href="/admin/projekte.html"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>Projekte</a></li>
        <li><a href="/admin/produkte.html"><svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>Produkte / Shop</a></li>
        <li><a href="/admin/bestellungen.html" class="active"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Bestellungen</a></li>
      </ul>
      <div class="sidebar-bottom">
        <a href="/" style="color:rgba(255,255,255,0.5);font-size:0.82rem;text-decoration:none;">← Zur Website</a>
        <button onclick="logout()" class="btn btn-outline btn-sm btn-full" style="margin-top:8px;color:rgba(255,255,255,0.7);border-color:rgba(255,255,255,0.2);">Abmelden</button>
      </div>
    </aside>

    <main class="main-content">
      <h1 class="page-title">Bestellungen</h1>
      <p class="page-subtitle">Eingegangene Bestellungen verwalten.</p>

      <div id="bestellungen-list"></div>

      <!-- Detail Modal -->
      <div class="admin-modal-bg" id="modal-detail">
        <div class="admin-modal">
          <div class="admin-modal-header">
            <h3 id="detail-title">Bestellung</h3>
            <button class="admin-modal-close" onclick="closeDetail()">&times;</button>
          </div>
          <div class="admin-modal-body" id="detail-body"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let bestellungen = [];

    async function checkAuth() {
      const res = await fetch('/admin/check');
      const data = await res.json();
      if (!data.loggedIn) window.location.href = '/admin/login.html';
    }
    async function logout() { await fetch('/admin/logout', { method: 'POST' }); window.location.href = '/admin/login.html'; }
    function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

    const statusColors = { 'Neu': 'badge-warning', 'Bearbeitung': 'badge-info', 'Versendet': 'badge-success', 'Storniert': 'badge-danger' };

    async function loadBestellungen() {
      const res = await fetch('/admin/api/bestellungen');
      bestellungen = await res.json();
      renderList();
    }

    function renderList() {
      const el = document.getElementById('bestellungen-list');
      if (bestellungen.length === 0) {
        el.innerHTML = '<div class="card" style="text-align:center;color:var(--text-light);">Noch keine Bestellungen eingegangen.</div>';
        return;
      }
      el.innerHTML = `
        <div class="card">
          <div class="table-wrap">
            <table>
              <thead><tr><th>Best.-Nr.</th><th>Kunde</th><th>Positionen</th><th>Total</th><th>Status</th><th>Datum</th><th></th></tr></thead>
              <tbody>
                ${bestellungen.map(b => `
                  <tr>
                    <td><strong>${esc(b.bestell_nr)}</strong></td>
                    <td>${esc(b.kunde_name)}<br><small style="color:var(--text-light)">${esc(b.kunde_email)}</small></td>
                    <td>${b.positionen.length} Artikel</td>
                    <td><strong>CHF ${b.total.toFixed(2)}</strong></td>
                    <td>
                      <select onchange="updateStatus(${b.id}, this.value)" style="padding:4px 8px;border-radius:6px;border:1px solid var(--border);font-size:0.82rem;">
                        ${['Neu','Bearbeitung','Versendet','Storniert'].map(s => `<option ${b.status===s?'selected':''}>${s}</option>`).join('')}
                      </select>
                    </td>
                    <td>${new Date(b.created_at).toLocaleDateString('de-CH')}</td>
                    <td><button class="btn btn-outline btn-sm" onclick="showDetail(${b.id})">Details</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    async function updateStatus(id, status) {
      await fetch(`/admin/api/bestellungen/${id}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
    }

    function showDetail(id) {
      const b = bestellungen.find(x => x.id === id);
      if (!b) return;
      document.getElementById('detail-title').textContent = 'Bestellung ' + b.bestell_nr;
      document.getElementById('detail-body').innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px;">
          <div>
            <h4 style="margin-bottom:8px;">Kundendaten</h4>
            <p><strong>${esc(b.kunde_name)}</strong></p>
            <p>${esc(b.kunde_email)}</p>
            <p>${esc(b.kunde_adresse)}</p>
            <p>${esc(b.kunde_plz)} ${esc(b.kunde_ort)}</p>
            ${b.kunde_telefon ? `<p>Tel: ${esc(b.kunde_telefon)}</p>` : ''}
          </div>
          <div>
            <h4 style="margin-bottom:8px;">Bestellung</h4>
            <p>Nr: <strong>${esc(b.bestell_nr)}</strong></p>
            <p>Datum: ${new Date(b.created_at).toLocaleString('de-CH')}</p>
            <p>Status: <span class="badge ${statusColors[b.status] || 'badge-info'}">${b.status}</span></p>
          </div>
        </div>
        ${b.bemerkung ? `<div style="margin-bottom:24px;padding:12px;background:var(--bg);border-radius:8px;"><strong>Bemerkung:</strong> ${esc(b.bemerkung)}</div>` : ''}
        <table>
          <thead><tr><th>Artikel</th><th>Anzahl</th><th>Preis</th><th>Summe</th></tr></thead>
          <tbody>
            ${b.positionen.map(p => `
              <tr>
                <td>${esc(p.produkt_name)}</td>
                <td>${p.anzahl}</td>
                <td>CHF ${p.preis.toFixed(2)}</td>
                <td><strong>CHF ${(p.anzahl * p.preis).toFixed(2)}</strong></td>
              </tr>
            `).join('')}
            <tr style="font-weight:700;">
              <td colspan="3" style="text-align:right;">Total</td>
              <td>CHF ${b.total.toFixed(2)}</td>
            </tr>
          </tbody>
        </table>
      `;
      document.getElementById('modal-detail').classList.add('active');
    }

    function closeDetail() { document.getElementById('modal-detail').classList.remove('active'); }

    checkAuth();
    loadBestellungen();
  </script>
</body>
</html>
