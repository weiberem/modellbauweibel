<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warenkorb – Modellbau Weibel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .cart-table { width: 100%; border-collapse: collapse; }
    .cart-table th { text-align: left; padding: 12px 16px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-light); border-bottom: 2px solid var(--border); }
    .cart-table td { padding: 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .cart-item-img { width: 80px; height: 60px; border-radius: 8px; object-fit: cover; background: var(--bg-alt); }
    .cart-qty { display: flex; align-items: center; gap: 8px; }
    .cart-qty button { width: 32px; height: 32px; border: 2px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
    .cart-qty button:hover { border-color: var(--accent); }
    .cart-qty span { min-width: 24px; text-align: center; font-weight: 600; }
    .cart-remove { background: none; border: none; color: var(--text-light); cursor: pointer; font-size: 1.2rem; padding: 4px 8px; }
    .cart-remove:hover { color: #dc2626; }

    .checkout-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; margin-top: 40px; }
    .checkout-summary { background: var(--bg-alt); border-radius: var(--radius); padding: 32px; position: sticky; top: 100px; }
    .summary-line { display: flex; justify-content: space-between; padding: 8px 0; font-size: 0.92rem; }
    .summary-total { display: flex; justify-content: space-between; padding: 16px 0 0; margin-top: 8px; border-top: 2px solid var(--border); font-size: 1.2rem; font-weight: 700; color: var(--primary); }

    .checkout-form .form-group { margin-bottom: 16px; }
    .checkout-form label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--primary); margin-bottom: 4px; }
    .checkout-form input, .checkout-form textarea { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px; font-size: 0.92rem; font-family: inherit; outline: none; }
    .checkout-form input:focus, .checkout-form textarea:focus { border-color: var(--accent); }
    .checkout-form .form-row { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }

    .empty-cart { text-align: center; padding: 80px 20px; }
    .empty-cart h2 { color: var(--text-light); margin-bottom: 16px; }

    .success-page { text-align: center; padding: 80px 20px; }
    .success-page h2 { color: var(--success); margin-bottom: 12px; }
    .success-page .checkmark { width: 80px; height: 80px; background: #dcfce7; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 2.5rem; color: var(--success); }

    #paypal-button-container { margin-top: 16px; min-height: 50px; }

    .payment-note { font-size: 0.82rem; color: var(--text-light); margin-top: 12px; text-align: center; }

    @media (max-width: 768px) {
      .checkout-grid { grid-template-columns: 1fr; }
      .checkout-form .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <div class="page-header">
    <div class="container">
      <span class="section-label" style="color:var(--accent);">Warenkorb</span>
      <h1>Ihr Warenkorb</h1>
    </div>
  </div>

  <section class="section">
    <div class="container" id="cart-content">
      <!-- Filled by JS -->
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/app.js"></script>
  <script src="js/shop.js"></script>
  <!-- PayPal SDK – SANDBOX: Ersetze die Client-ID mit deiner echten PayPal Client-ID für Live -->
  <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=CHF&locale=de_CH" data-namespace="paypal"></script>
  <script>
    function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

    function renderCart() {
      const container = document.getElementById('cart-content');
      const items = Cart.getItems();

      if (items.length === 0) {
        container.innerHTML = `
          <div class="empty-cart">
            <h2>Ihr Warenkorb ist leer</h2>
            <p style="color:var(--text-light);margin-bottom:24px;">Stöbern Sie in unserem Shop und finden Sie das passende Modell.</p>
            <a href="/shop.html" class="btn btn-primary">Zum Shop</a>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="table-wrap" style="background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;">
          <table class="cart-table">
            <thead><tr><th></th><th>Produkt</th><th>Preis</th><th>Anzahl</th><th>Summe</th><th></th></tr></thead>
            <tbody>
              ${items.map(item => `
                <tr>
                  <td>${item.titelbild ? `<img src="${item.titelbild}" class="cart-item-img">` : '<div class="cart-item-img" style="display:flex;align-items:center;justify-content:center;color:var(--text-light);font-size:0.7rem;">Kein Bild</div>'}</td>
                  <td><strong>${esc(item.produkt_name)}</strong></td>
                  <td>CHF ${item.preis.toFixed(2)}</td>
                  <td>
                    <div class="cart-qty">
                      <button onclick="updateQty(${item.produkt_id}, ${item.anzahl - 1})">−</button>
                      <span>${item.anzahl}</span>
                      <button onclick="updateQty(${item.produkt_id}, ${item.anzahl + 1})">+</button>
                    </div>
                  </td>
                  <td><strong>CHF ${(item.preis * item.anzahl).toFixed(2)}</strong></td>
                  <td><button class="cart-remove" onclick="removeItem(${item.produkt_id})" title="Entfernen">&times;</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>

        <div class="checkout-grid">
          <!-- Checkout Form -->
          <div>
            <h3 style="margin-bottom:20px;">Lieferadresse</h3>
            <form class="checkout-form" id="checkout-form">
              <div class="form-group">
                <label>Name *</label>
                <input type="text" id="ch-name" required placeholder="Vor- und Nachname">
              </div>
              <div class="form-group">
                <label>E-Mail *</label>
                <input type="email" id="ch-email" required placeholder="ihre@email.ch">
              </div>
              <div class="form-group">
                <label>Strasse / Nr. *</label>
                <input type="text" id="ch-adresse" required placeholder="Bachelstrasse 1">
              </div>
              <div class="form-group">
                <div class="form-row">
                  <div>
                    <label>PLZ *</label>
                    <input type="text" id="ch-plz" required placeholder="3116">
                  </div>
                  <div>
                    <label>Ort *</label>
                    <input type="text" id="ch-ort" required placeholder="Lohnstorf">
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label>Telefon</label>
                <input type="text" id="ch-telefon" placeholder="Optional">
              </div>
              <div class="form-group">
                <label>Bemerkung</label>
                <textarea id="ch-bemerkung" rows="3" placeholder="Optionale Nachricht zur Bestellung..."></textarea>
              </div>
            </form>
          </div>

          <!-- Summary -->
          <div>
            <div class="checkout-summary">
              <h3 style="margin-bottom:16px;">Zusammenfassung</h3>
              ${items.map(i => `
                <div class="summary-line">
                  <span>${esc(i.produkt_name)} × ${i.anzahl}</span>
                  <span>CHF ${(i.preis * i.anzahl).toFixed(2)}</span>
                </div>
              `).join('')}
              <div class="summary-line" style="color:var(--text-light);">
                <span>Versand</span>
                <span>Wird berechnet</span>
              </div>
              <div class="summary-total">
                <span>Total</span>
                <span>CHF ${Cart.getTotal().toFixed(2)}</span>
              </div>

              <div id="paypal-button-container"></div>
              <div id="checkout-error" style="display:none;" class="error-msg"></div>
              <p class="payment-note">Sichere Zahlung via PayPal oder Kreditkarte</p>
            </div>
          </div>
        </div>
      `;

      initPayPal();
    }

    function updateQty(id, qty) {
      Cart.updateQuantity(id, qty);
      renderCart();
    }

    function removeItem(id) {
      Cart.remove(id);
      renderCart();
    }

    function validateForm() {
      const fields = ['ch-name', 'ch-email', 'ch-adresse', 'ch-plz', 'ch-ort'];
      for (const id of fields) {
        const el = document.getElementById(id);
        if (!el || !el.value.trim()) {
          el.focus();
          return false;
        }
      }
      const email = document.getElementById('ch-email').value;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('ch-email').focus();
        return false;
      }
      return true;
    }

    function getFormData() {
      return {
        kunde_name: document.getElementById('ch-name').value.trim(),
        kunde_email: document.getElementById('ch-email').value.trim(),
        kunde_adresse: document.getElementById('ch-adresse').value.trim(),
        kunde_plz: document.getElementById('ch-plz').value.trim(),
        kunde_ort: document.getElementById('ch-ort').value.trim(),
        kunde_telefon: document.getElementById('ch-telefon')?.value.trim() || '',
        bemerkung: document.getElementById('ch-bemerkung')?.value.trim() || ''
      };
    }

    function initPayPal() {
      const container = document.getElementById('paypal-button-container');
      if (!container || typeof paypal === 'undefined') return;

      paypal.Buttons({
        style: { layout: 'vertical', color: 'gold', shape: 'rect', label: 'pay', height: 50 },

        onClick(data, actions) {
          const errEl = document.getElementById('checkout-error');
          errEl.style.display = 'none';
          if (!validateForm()) {
            errEl.textContent = 'Bitte füllen Sie alle Pflichtfelder aus.';
            errEl.style.display = 'block';
            return actions.reject();
          }
          return actions.resolve();
        },

        createOrder(data, actions) {
          const items = Cart.getItems();
          return actions.order.create({
            purchase_units: [{
              amount: {
                currency_code: 'CHF',
                value: Cart.getTotal().toFixed(2),
                breakdown: {
                  item_total: { currency_code: 'CHF', value: Cart.getTotal().toFixed(2) }
                }
              },
              items: items.map(i => ({
                name: i.produkt_name,
                unit_amount: { currency_code: 'CHF', value: i.preis.toFixed(2) },
                quantity: i.anzahl.toString()
              }))
            }]
          });
        },

        onApprove(data, actions) {
          return actions.order.capture().then(async function(details) {
            // Payment successful – create order in our system
            const formData = getFormData();
            const items = Cart.getItems();

            try {
              const res = await fetch('/api/bestellen', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  ...formData,
                  positionen: items.map(i => ({
                    produkt_id: i.produkt_id,
                    produkt_name: i.produkt_name,
                    anzahl: i.anzahl
                  }))
                })
              });
              const result = await res.json();
              if (result.success) {
                Cart.clear();
                showSuccess(result.bestell_nr, formData.kunde_email);
              } else {
                showError(result.error);
              }
            } catch {
              showError('Bestellung konnte nicht gespeichert werden.');
            }
          });
        },

        onError(err) {
          showError('Zahlung fehlgeschlagen. Bitte versuchen Sie es erneut.');
        }
      }).render('#paypal-button-container');
    }

    function showSuccess(bestellNr, email) {
      document.getElementById('cart-content').innerHTML = `
        <div class="success-page">
          <div class="checkmark">✓</div>
          <h2>Bestellung erfolgreich!</h2>
          <p style="font-size:1.1rem;margin-bottom:8px;">Ihre Bestellnummer: <strong>${bestellNr}</strong></p>
          <p style="color:var(--text-light);margin-bottom:32px;">Eine Bestätigung wird an ${esc(email)} gesendet.</p>
          <a href="/shop.html" class="btn btn-primary">Weiter einkaufen</a>
        </div>
      `;
    }

    function showError(msg) {
      const el = document.getElementById('checkout-error');
      if (el) { el.textContent = msg; el.style.display = 'block'; }
    }

    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
